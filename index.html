<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guess The Country!</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%2338bdf8' stroke='%230284c7' stroke-width='4'/%3E%3Cpath d='M18 16c6-2 14 1 16 7s-4 11-2 17 11 6 14 12M44 14c5 4 7 11 3 16s-9 4-8 10 6 8 4 13' fill='none' stroke='%2322c55e' stroke-width='7' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #eef7ff;
      --bg-dots: rgba(14, 165, 233, 0.13);
      --surface: rgba(255, 255, 255, 0.9);
      --surface-solid: #ffffff;
      --surface-subtle: #f1f8fe;
      --surface-hover: #e0f2fe;
      --border: rgba(148, 163, 184, 0.25);
      --border-strong: rgba(100, 116, 139, 0.32);
      --text: #0f172a;
      --text-secondary: #475569;
      --text-muted: #94a3b8;
      --accent: #10b981;
      --accent-hover: #059669;
      --accent-soft: #d1fae5;
      --accent-ring: rgba(16, 185, 129, 0.32);
      --ocean-top: #cfeefd;
      --ocean-bottom: #b5e2fa;
      --graticule: rgba(2, 132, 199, 0.12);
      --land-unguessed: #fffdf7;
      --land-unguessed-hover: #fef3c7;
      --land-territory: #f1f5f9;
      --land-stroke: #94a3b8;
      --land-guessed: #22c55e;
      --land-guessed-hover: #16a34a;
      --land-Guessed-stroke: #15803d;
      --land-recent: #f59e0b;
      --land-missed: #fb7185;
      --land-missed-soft: #ffe4e6;
      --land-pinned: #3b82f6;
      --dot-unguessed: #ffffff;
      --dot-stroke: #475569;
      --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.06);
      --shadow-md: 0 8px 24px rgba(15, 23, 42, 0.09);
      --shadow-pop: 0 4px 0 rgba(15, 23, 42, 0.08);
      --radius-pill: 999px;
      --radius-lg: 24px;
      --radius-md: 18px;
    }

    html[data-theme="dark"] {
      --bg: #0b1120;
      --bg-dots: rgba(56, 189, 248, 0.08);
      --surface: rgba(17, 24, 39, 0.88);
      --surface-solid: #111827;
      --surface-subtle: #1e293b;
      --surface-hover: #334155;
      --border: rgba(148, 163, 184, 0.16);
      --border-strong: rgba(148, 163, 184, 0.28);
      --text: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --accent: #22c55e;
      --accent-hover: #4ade80;
      --accent-soft: rgba(34, 197, 94, 0.18);
      --accent-ring: rgba(34, 197, 94, 0.35);
      --ocean-top: #0c192c;
      --ocean-bottom: #07101e;
      --graticule: rgba(56, 189, 248, 0.08);
      --land-unguessed: #1e293b;
      --land-unguessed-hover: #334155;
      --land-territory: #151e2e;
      --land-stroke: #475569;
      --land-guessed: #22c55e;
      --land-guessed-hover: #4ade80;
      --land-Guessed-stroke: #14532d;
      --land-recent: #fbbf24;
      --land-missed: #f43f5e;
      --land-missed-soft: rgba(244, 63, 94, 0.18);
      --land-pinned: #60a5fa;
      --dot-unguessed: #334155;
      --dot-stroke: #94a3b8;
      --shadow-sm: 0 2px 10px rgba(0, 0, 0, 0.35);
      --shadow-md: 0 10px 30px rgba(0, 0, 0, 0.5);
      --shadow-pop: 0 4px 0 rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    body {
      font-family: 'Fredoka', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      background-image: radial-gradient(var(--bg-dots) 1.5px, transparent 1.5px);
      background-size: 22px 22px;
      color: var(--text);
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.25s ease, color 0.25s ease;
      overflow-x: hidden;
    }

    .main-container {
      max-width: 1380px;
      margin: 0 auto;
      padding: 0.75rem 1rem 2.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    /* Unified Creative Floating Command Dock */
    .command-dock {
      position: sticky;
      top: 0.55rem;
      z-index: 50;
      background: var(--surface);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 2px solid var(--border-strong);
      border-radius: var(--radius-pill);
      box-shadow: var(--shadow-md), var(--shadow-pop);
      padding: 0.42rem 0.65rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.55rem;
      flex-wrap: wrap;
      overflow: hidden;
    }

    .dock-left {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .brand-globe {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: linear-gradient(135deg, #38bdf8 0%, #10b981 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      box-shadow: 0 3px 10px rgba(16, 185, 129, 0.3);
      cursor: pointer;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      user-select: none;
      flex-shrink: 0;
    }

    .brand-globe:hover {
      transform: rotate(20deg) scale(1.1);
    }

    .pill-select-wrap {
      display: inline-flex;
      align-items: center;
      background: var(--surface-subtle);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-pill);
      padding: 0.25rem 0.6rem;
      gap: 0.25rem;
      font-size: 0.84rem;
      transition: all 0.15s ease;
    }

    .pill-select-wrap:hover {
      border-color: var(--border-strong);
      background: var(--surface-hover);
    }

    .select-control {
      background: transparent;
      border: none;
      color: var(--text);
      font-family: inherit;
      font-weight: 600;
      font-size: 0.84rem;
      cursor: pointer;
      outline: none;
    }

    .select-control option {
      background: var(--surface-solid);
      color: var(--text);
    }

    /* Center Input & Live Score/Timer Pills */
    .dock-center {
      flex: 1 1 320px;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      max-width: 560px;
    }

    .input-wrapper {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 0.85rem;
      font-size: 1.05rem;
      pointer-events: none;
      transition: transform 0.2s ease;
    }

    .guess-input {
      width: 100%;
      padding: 0.55rem 2.5rem 0.55rem 2.45rem;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      color: var(--text);
      background: var(--surface-subtle);
      border: 2px solid var(--border-strong);
      border-radius: var(--radius-pill);
      outline: none;
      transition: all 0.18s ease;
    }

    .guess-input::placeholder {
      color: var(--text-muted);
      font-weight: 500;
    }

    .guess-input:focus {
      background: var(--surface-solid);
      border-color: var(--accent);
      box-shadow: 0 0 0 4px var(--accent-ring);
    }

    .guess-input:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .guess-input.flash-success {
      border-color: var(--land-guessed);
      box-shadow: 0 0 0 5px rgba(34, 197, 94, 0.38);
      transform: scale(1.01);
    }

    .input-badge {
      position: absolute;
      right: 0.55rem;
      font-size: 0.82rem;
      font-weight: 600;
      padding: 0.15rem 0.45rem;
      border-radius: var(--radius-pill);
      color: var(--text-muted);
      pointer-events: none;
    }

    .input-badge.pinned {
      background: rgba(59, 130, 246, 0.15);
      color: var(--land-pinned);
    }

    .stat-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      background: var(--surface-subtle);
      border: 1.5px solid var(--border);
      padding: 0.38rem 0.72rem;
      border-radius: var(--radius-pill);
      font-family: 'Space Mono', monospace;
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      user-select: none;
    }

    .stat-chip.score-chip {
      background: var(--accent-soft);
      border-color: rgba(16, 185, 129, 0.35);
      color: var(--accent-hover);
    }

    html[data-theme="dark"] .stat-chip.score-chip {
      color: #4ade80;
    }

    .timer-value.warning {
      color: #d97706;
    }

    .timer-value.danger {
      color: #e11d48;
      animation: pulseText 0.9s infinite;
    }

    @keyframes pulseText {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.06); opacity: 0.65; }
    }

    /* Right Circular Icon-Only Buttons */
    .dock-right {
      display: flex;
      align-items: center;
      gap: 0.32rem;
    }

    .circle-btn {
      position: relative;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1.5px solid var(--border);
      background: var(--surface-subtle);
      color: var(--text);
      font-size: 1.02rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
      user-select: none;
      flex-shrink: 0;
    }

    .circle-btn:hover:not(:disabled) {
      transform: translateY(-2px) scale(1.07);
      background: var(--surface-hover);
      border-color: var(--border-strong);
    }

    .circle-btn:active:not(:disabled) {
      transform: translateY(0) scale(0.96);
    }

    .circle-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .circle-btn.active {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent-hover);
    }

    .circle-btn.btn-hint {
      background: rgba(59, 130, 246, 0.12);
      border-color: rgba(59, 130, 246, 0.35);
    }

    .circle-btn.btn-danger {
      background: rgba(244, 63, 94, 0.1);
      border-color: rgba(244, 63, 94, 0.3);
    }

    .circle-btn.btn-danger.confirming {
      width: auto;
      padding: 0 0.7rem;
      border-radius: var(--radius-pill);
      background: #e11d48;
      color: #ffffff;
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 600;
    }

    .dock-divider {
      width: 1.5px;
      height: 20px;
      background: var(--border);
      margin: 0 0.1rem;
    }

    .hud-progress-track {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 3.5px;
      background: transparent;
      pointer-events: none;
    }

    .hud-progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #38bdf8, #22c55e, #f59e0b);
      transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Map Hero Card */
    .map-card {
      position: relative;
      background: radial-gradient(circle at 50% 35%, var(--ocean-top) 0%, var(--ocean-bottom) 100%);
      border: 2px solid var(--border-strong);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md), var(--shadow-pop);
      overflow: hidden;
      height: clamp(360px, 62vh, 660px);
      user-select: none;
      touch-action: none;
    }

    .world-svg {
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
    }

    .world-svg.dragging {
      cursor: grabbing;
    }

    /* Floating Dynamic Feedback Pill inside Map Top-Center */
    .floating-status {
      position: absolute;
      top: 0.75rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 15;
      display: flex;
      align-items: center;
      gap: 0.45rem;
      pointer-events: none;
    }

    .floating-status:empty {
      display: none;
    }

    .recent-pill,
    .hint-pill {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.32rem 0.85rem;
      border-radius: var(--radius-pill);
      background: var(--surface);
      backdrop-filter: blur(10px);
      border: 1.5px solid var(--border-strong);
      box-shadow: var(--shadow-sm);
      font-weight: 600;
      font-size: 0.86rem;
      color: var(--text);
      cursor: pointer;
      animation: popIn 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .hint-pill {
      border-color: var(--land-pinned);
      color: var(--land-pinned);
    }

    @keyframes popIn {
      0% { transform: scale(0.85) translateY(-6px); opacity: 0; }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }

    /* Personal Best Trophy Badge on Map Top-Right */
    .best-badge {
      position: absolute;
      top: 0.75rem;
      right: 0.75rem;
      z-index: 12;
      background: var(--surface);
      backdrop-filter: blur(8px);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-pill);
      padding: 0.25rem 0.65rem;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-secondary);
      pointer-events: none;
    }

    .best-badge:empty {
      display: none;
    }

    /* Map SVG Elements */
    .graticule-line {
      fill: none;
      stroke: var(--graticule);
      stroke-width: 0.9;
      stroke-dasharray: 4 4;
      vector-effect: non-scaling-stroke;
      pointer-events: none;
    }

    .territory-path {
      fill: var(--land-territory);
      stroke: var(--land-stroke);
      stroke-width: 0.55;
      vector-effect: non-scaling-stroke;
      transition: fill 0.25s ease;
    }

    .territory-path.parent-guessed {
      fill: var(--land-guessed);
      fill-opacity: 0.55;
    }

    .country-path {
      fill: var(--land-unguessed);
      stroke: var(--land-stroke);
      stroke-width: 0.7;
      vector-effect: non-scaling-stroke;
      stroke-linejoin: round;
      transition: fill 0.2s ease, stroke 0.2s ease;
      cursor: pointer;
    }

    .country-path:hover {
      fill: var(--land-unguessed-hover);
    }

    .country-path.out-of-scope {
      fill: var(--land-territory);
      opacity: 0.38;
      pointer-events: none;
    }

    .country-path.guessed {
      fill: var(--land-guessed);
      stroke: var(--land-Guessed-stroke);
      stroke-width: 0.8;
    }

    .country-path.guessed:hover {
      fill: var(--land-guessed-hover);
    }

    .country-path.just-guessed {
      fill: var(--land-recent);
      stroke: #b45309;
      stroke-width: 1.3;
    }

    .country-path.missed {
      fill: var(--land-missed);
      stroke: #be123c;
      stroke-width: 0.85;
    }

    .country-path.pinned {
      stroke: var(--land-pinned);
      stroke-width: 2.3;
      fill: rgba(59, 130, 246, 0.3);
    }

    /* Microstate & Island Dots */
    .country-dot {
      fill: var(--dot-unguessed);
      stroke: var(--dot-stroke);
      stroke-width: 1.2;
      cursor: pointer;
      transition: fill 0.2s ease, r 0.2s ease, stroke 0.2s ease;
    }

    .country-dot:hover {
      stroke-width: 2;
      stroke: var(--text);
    }

    .country-dot.out-of-scope {
      display: none;
    }

    .country-dot.guessed {
      fill: var(--land-guessed);
      stroke: #ffffff;
      stroke-width: 1.3;
    }

    .country-dot.just-guessed {
      fill: var(--land-recent);
      stroke: #ffffff;
      stroke-width: 1.7;
    }

    .country-dot.missed {
      fill: var(--land-missed);
      stroke: #ffffff;
      stroke-width: 1.3;
    }

    .country-dot.pinned {
      fill: var(--land-pinned);
      stroke: #ffffff;
      stroke-width: 1.9;
    }

    .hide-dots .country-dot:not(.guessed):not(.missed):not(.pinned):not(.just-guessed) {
      opacity: 0;
      pointer-events: none;
    }

    /* Animated Radar Ping */
    .ping-ring {
      fill: none;
      stroke: var(--land-recent);
      stroke-width: 2.8;
      pointer-events: none;
      animation: radarPing 1.25s cubic-bezier(0, 0, 0.2, 1) forwards;
    }

    @keyframes radarPing {
      0% { r: 2; opacity: 1; stroke-width: 3.8; }
      100% { r: 38; opacity: 0; stroke-width: 0.5; }
    }

    /* Compact Icon-Driven Camera Pills on Map Top-Left */
    .map-camera-tabs {
      position: absolute;
      top: 0.75rem;
      left: 0.75rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.25rem;
      z-index: 10;
      background: var(--surface);
      backdrop-filter: blur(10px);
      padding: 0.25rem;
      border-radius: var(--radius-pill);
      border: 1.5px solid var(--border);
      box-shadow: var(--shadow-sm);
    }

    .camera-tab {
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 0.28rem 0.55rem;
      border-radius: var(--radius-pill);
      cursor: pointer;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.22rem;
    }

    .camera-tab:hover {
      color: var(--text);
      background: var(--surface-hover);
    }

    .camera-tab.active {
      background: var(--accent);
      color: #ffffff;
    }

    /* Floating Zoom Dock Bottom-Right */
    .map-zoom-controls {
      position: absolute;
      bottom: 0.85rem;
      right: 0.85rem;
      display: flex;
      flex-direction: column;
      gap: 0.28rem;
      z-index: 10;
      background: var(--surface);
      backdrop-filter: blur(10px);
      padding: 0.28rem;
      border-radius: 999px;
      border: 1.5px solid var(--border);
      box-shadow: var(--shadow-sm);
    }

    .zoom-btn {
      width: 32px;
      height: 32px;
      border: none;
      background: transparent;
      color: var(--text);
      font-family: inherit;
      font-size: 1.05rem;
      font-weight: 700;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }

    .zoom-btn:hover {
      background: var(--surface-hover);
      transform: scale(1.08);
    }

    /* Map Tooltip */
    .map-tooltip {
      position: fixed;
      z-index: 100;
      pointer-events: none;
      background: var(--surface-solid);
      color: var(--text);
      border: 2px solid var(--border-strong);
      border-radius: 14px;
      padding: 0.45rem 0.75rem;
      font-size: 0.82rem;
      box-shadow: var(--shadow-md);
      display: none;
      flex-direction: column;
      gap: 0.1rem;
      max-width: 240px;
    }

    .map-tooltip.visible {
      display: flex;
    }

    .tooltip-title {
      font-weight: 700;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .tooltip-meta {
      color: var(--text-secondary);
      font-size: 0.75rem;
    }

    /* Pause Overlay */
    .pause-overlay {
      position: absolute;
      inset: 0;
      z-index: 25;
      background: rgba(15, 23, 42, 0.55);
      backdrop-filter: blur(12px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.9rem;
      color: #ffffff;
      text-align: center;
      padding: 1.5rem;
    }

    .pause-overlay.visible {
      display: flex;
    }

    .pause-title {
      font-size: 1.7rem;
      font-weight: 700;
    }

    /* Post-Game Summary Banner */
    .summary-banner {
      display: none;
      background: var(--surface-solid);
      border: 2px solid var(--accent);
      border-radius: var(--radius-md);
      padding: 0.85rem 1.15rem;
      box-shadow: var(--shadow-md);
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.85rem;
    }

    .summary-banner.visible {
      display: flex;
    }

    .summary-stats {
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .summary-score-big {
      font-family: 'Space Mono', monospace;
      font-size: 1.65rem;
      font-weight: 700;
      color: var(--accent);
    }

    .summary-headline {
      font-weight: 700;
      font-size: 1.05rem;
      color: var(--text);
    }

    .summary-subtext {
      font-size: 0.82rem;
      color: var(--text-secondary);
    }

    .btn-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.38rem;
      padding: 0.48rem 0.95rem;
      border-radius: var(--radius-pill);
      font-family: inherit;
      font-size: 0.86rem;
      font-weight: 600;
      cursor: pointer;
      border: 1.5px solid var(--border-strong);
      background: var(--surface-subtle);
      color: var(--text);
      transition: all 0.15s ease;
    }

    .btn-pill:hover {
      transform: translateY(-1px);
      background: var(--surface-hover);
    }

    .btn-pill.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }

    /* Minimal Icon Filter Bar above Continents */
    .list-header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .filter-pills {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      background: var(--surface);
      padding: 0.25rem;
      border-radius: var(--radius-pill);
      border: 1.5px solid var(--border);
    }

    .filter-pill {
      padding: 0.3rem 0.75rem;
      border-radius: var(--radius-pill);
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 600;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .filter-pill:hover {
      color: var(--text);
    }

    .filter-pill.active {
      background: var(--text);
      color: var(--surface-solid);
    }

    /* Continent Grid & Cards */
    .continents-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 0.85rem;
    }

    .continent-card {
      background: var(--surface);
      backdrop-filter: blur(8px);
      border: 1.5px solid var(--border-strong);
      border-radius: var(--radius-md);
      padding: 0.8rem 0.95rem;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .continent-card.hidden {
      display: none;
    }

    .continent-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }

    .continent-title {
      font-weight: 700;
      font-size: 0.98rem;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 0.4rem;
      cursor: pointer;
    }

    .continent-title:hover {
      color: var(--accent);
    }

    .continent-count {
      font-family: 'Space Mono', monospace;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-secondary);
      background: var(--surface-subtle);
      padding: 0.15rem 0.55rem;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border);
    }

    .continent-progress {
      height: 5px;
      width: 100%;
      background: var(--surface-subtle);
      border-radius: var(--radius-pill);
      overflow: hidden;
    }

    .continent-progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #38bdf8, #22c55e);
      transition: width 0.25s ease;
    }

    .country-slots-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.32rem 0.45rem;
    }

    .country-slot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.3rem;
      padding: 0.28rem 0.55rem;
      border-radius: 10px;
      font-size: 0.82rem;
      background: var(--surface-subtle);
      border: 1.5px solid transparent;
      min-height: 30px;
      transition: all 0.15s ease;
    }

    .country-slot.unguessed {
      color: var(--text-muted);
      cursor: pointer;
    }

    .country-slot.unguessed:hover {
      border-color: var(--border-strong);
      transform: translateY(-1px);
    }

    .country-slot.pinned {
      border-color: var(--land-pinned);
      background: rgba(59, 130, 246, 0.1);
      color: var(--land-pinned);
    }

    .country-slot.guessed {
      background: var(--accent-soft);
      border-color: rgba(34, 197, 94, 0.32);
      color: var(--text);
      font-weight: 600;
      cursor: pointer;
      animation: popIn 0.2s ease;
    }

    .country-slot.guessed:hover {
      border-color: var(--accent);
    }

    .country-slot.missed {
      background: var(--land-missed-soft);
      border-color: rgba(244, 63, 94, 0.32);
      color: var(--land-missed);
      font-weight: 600;
      cursor: pointer;
    }

    .country-slot.hidden-slot {
      display: none;
    }

    .slot-left {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .slot-num {
      font-family: 'Space Mono', monospace;
      font-size: 0.68rem;
      color: var(--text-muted);
      opacity: 0.75;
    }

    .slot-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .slot-hint-tag {
      font-size: 0.7rem;
      color: var(--text-secondary);
      opacity: 0.85;
      flex-shrink: 0;
    }

    /* Toast Notification */
    .toast-box {
      position: fixed;
      bottom: 1.25rem;
      right: 1.25rem;
      z-index: 90;
      background: var(--text);
      color: var(--surface-solid);
      padding: 0.55rem 1rem;
      border-radius: var(--radius-pill);
      font-size: 0.84rem;
      font-weight: 600;
      box-shadow: var(--shadow-md);
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
      transition: all 0.2s ease;
    }

    .toast-box.show {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 820px) {
      .command-dock {
        border-radius: 20px;
        padding: 0.5rem;
      }
      .continents-grid {
        grid-template-columns: 1fr;
      }
      .map-card {
        height: 360px;
      }
    }
  </style>
</head>

      <div class="dock-right">

    const scoreDisplay = document.getElementById("scoreDisplay");
    const percentDisplay = document.getElementById("percentDisplay");
    const timerModeLabel = document.getElementById("timerModeLabel");
    const timerDisplay = document.getElementById("timerDisplay");
    const hudProgressFill = document.getElementById("hudProgressFill");
    const statusLeft = document.getElementById("statusLeft");
    const bestScoreDisplay = document.getElementById("bestScoreDisplay");
    const continentsGrid = document.getElementById("continentsGrid");
    const pauseOverlay = document.getElementById("pauseOverlay");
    const summaryBanner = document.getElementById("summaryBanner");
    const summaryScoreBig = document.getElementById("summaryScoreBig");
    const summaryHeadline = document.getElementById("summaryHeadline");
    const summarySubtext = document.getElementById("summarySubtext");
    const toastBox = document.getElementById("toastBox");

    const polyElementsByIso = new Map();
    const dotElementsByIso = new Map();
    const slotElementsByIso = new Map();
    const territoryElements = [];

    function showToast(msg) {
      toastBox.textContent = msg;
      toastBox.classList.add("show");
      clearTimeout(showToast._tid);
      showToast._tid = setTimeout(() => {
        toastBox.classList.remove("show");
      }, 2200);
    }

    function setFloatingStatus(htmlContent, autoHideMs = 4500) {
      statusLeft.innerHTML = htmlContent;
      clearTimeout(state.statusClearTimeout);
      if (htmlContent && autoHideMs > 0) {
        state.statusClearTimeout = setTimeout(() => {
          statusLeft.innerHTML = "";
        }, autoHideMs);
      }
    }

    function initSvgMap() {
      const W = MAP_DATA.svgWidth;
      const H = MAP_DATA.svgHeight;
      for (let i = 1; i <= 5; i++) {
        const y = (H / 6) * i;
        const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
        line.setAttribute("x1", "0");
        line.setAttribute("y1", y.toFixed(1));
        line.setAttribute("x2", W.toFixed(1));
        line.setAttribute("y2", y.toFixed(1));
        line.setAttribute("class", "graticule-line");
        graticuleLayer.appendChild(line);
      }
      for (let i = 1; i <= 7; i++) {
        const x = (W / 8) * i;
        const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
        line.setAttribute("x1", x.toFixed(1));
        line.setAttribute("y1", "0");
        line.setAttribute("x2", x.toFixed(1));
        line.setAttribute("y2", H.toFixed(1));
        line.setAttribute("class", "graticule-line");
        graticuleLayer.appendChild(line);
      }

      MAP_DATA.territories.forEach((t) => {
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("d", t.path);
        path.setAttribute("class", "territory-path");
        path.dataset.name = t.name;
        path.dataset.parent = t.parent || "";
        territoryLayer.appendChild(path);
        territoryElements.push(path);
      });

      MAP_DATA.pathOrder.forEach((iso) => {
        const dStr = MAP_DATA.paths[iso];
        if (!dStr) return;
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("d", dStr);
        path.setAttribute("class", "country-path");
        path.dataset.iso = iso;
        path.addEventListener("click", (e) => {
          e.stopPropagation();
          handleMapCountryClick(iso);
        });
        path.addEventListener("mousemove", (e) => handleMapHover(e, iso));
        path.addEventListener("mouseleave", hideMapTooltip);
        countryPolyLayer.appendChild(path);
        polyElementsByIso.set(iso, path);
      });

      const EXTRA_DOT_ISOS = new Set([
        "LUX", "BRN", "GMB", "DJI", "PSE", "QAT", "KWT",
        "TTO", "JAM", "BHS", "VUT", "FJI", "SLB", "TLS",
        "SWZ", "LSO", "CYP", "LBN", "XKX", "MNE"
      ]);

      MAP_DATA.countries.forEach((c) => {
        if (!c.hasPoly || EXTRA_DOT_ISOS.has(c.iso)) {
          const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
          circle.setAttribute("cx", c.cx);
          circle.setAttribute("cy", c.cy);
          circle.setAttribute("r", c.hasPoly ? "3.2" : "4.2");
          circle.dataset.baseR = c.hasPoly ? "3.2" : "4.2";
          circle.setAttribute("class", "country-dot");
          circle.dataset.iso = c.iso;
          circle.addEventListener("click", (e) => {
            e.stopPropagation();
            handleMapCountryClick(c.iso);
          });
          circle.addEventListener("mousemove", (e) => handleMapHover(e, c.iso));
          circle.addEventListener("mouseleave", hideMapTooltip);
          countryDotLayer.appendChild(circle);
          dotElementsByIso.set(c.iso, circle);
        }
      });
    }

    function triggerMapPing(iso) {
      const c = countriesByIso.get(iso);
      if (!c) return;
      const ring = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      ring.setAttribute("cx", c.cx);
      ring.setAttribute("cy", c.cy);
      ring.setAttribute("r", "3");
      ring.setAttribute("class", "ping-ring");
      pingLayer.appendChild(ring);
      setTimeout(() => {
        if (ring.parentNode) ring.parentNode.removeChild(ring);
      }, 1350);
    }

    function computeActiveIsos(scope) {
      const set = new Set();
      MAP_DATA.countries.forEach((c) => {
        if (scope === "all197") {
          set.add(c.iso);
        } else if (scope === "jetpunk196") {
          if (c.iso !== "PSE") set.add(c.iso);
        } else if (scope === "un193") {
          if (!NON_UN_ISOS.has(c.iso)) set.add(c.iso);
        } else if (c.continent === scope) {
          set.add(c.iso);
        }
      });
      return set;
    }

    function buildContinentCards() {
      continentsGrid.innerHTML = "";
      slotElementsByIso.clear();

      CONTINENT_ORDER.forEach((cont) => {
        const contCountries = MAP_DATA.countries
          .filter((c) => c.continent === cont && state.activeIsos.has(c.iso))
          .sort((a, b) => a.name.localeCompare(b.name));

        const card = document.createElement("div");
        card.className = "continent-card" + (contCountries.length === 0 ? " hidden" : "");
        card.dataset.continent = cont;

        const header = document.createElement("div");
        header.className = "continent-header";

        const title = document.createElement("div");
        title.className = "continent-title";
        title.title = `Zoom to ${cont}`;
        title.innerHTML = `<span>${CONTINENT_ICONS[cont] || "🌍"}</span><span>${cont}</span>`;
        title.addEventListener("click", () => animateCameraTo(cont));

        const countBadge = document.createElement("span");
        countBadge.className = "continent-count";
        countBadge.id = `contCount-${cont.replace(/\s+/g, "-")}`;
        countBadge.textContent = `0/${contCountries.length}`;

        header.appendChild(title);
        header.appendChild(countBadge);

        const progTrack = document.createElement("div");
        progTrack.className = "continent-progress";
        const progBar = document.createElement("div");
        progBar.className = "continent-progress-bar";
        progBar.id = `contBar-${cont.replace(/\s+/g, "-")}`;
        progTrack.appendChild(progBar);

        const grid = document.createElement("div");
        grid.className = "country-slots-grid";

        contCountries.forEach((c, idx) => {
          const slot = document.createElement("div");
          slot.className = "country-slot unguessed";
          slot.dataset.iso = c.iso;
          slot.addEventListener("click", () => handleSlotClick(c.iso));
          slotElementsByIso.set(c.iso, { el: slot, index: idx + 1, country: c });
          grid.appendChild(slot);
        });

        card.appendChild(header);
        card.appendChild(progTrack);
        card.appendChild(grid);
        continentsGrid.appendChild(card);
      });

      refreshAllSlots();
    }

    function renderSlot(iso) {
      const entry = slotElementsByIso.get(iso);
      if (!entry) return;
      const { el, index, country } = entry;
      const isGuessed = state.guessedIsos.has(iso);
      const isMissed = state.gameOver && !isGuessed;
      const isPinned = state.pinnedIso === iso && !isGuessed && !state.gameOver;
      const isHinted = state.hintedIsos.has(iso);

      let hidden = false;
      if (state.listFilter === "guessed" && !isGuessed) hidden = true;
      if (state.listFilter === "remaining" && isGuessed) hidden = true;

      el.className = "country-slot " + (
        isGuessed ? "guessed" : isMissed ? "missed" : isPinned ? "pinned" : "unguessed"
      ) + (hidden ? " hidden-slot" : "");

      const numSpan = `<span class="slot-num">${String(index).padStart(2, "0")}</span>`;

      if (isGuessed || isMissed) {
        el.innerHTML = `
          <div class="slot-left">
            <span>${country.flag}</span>
            <span class="slot-name">${country.name}</span>
          </div>
          <span class="slot-hint-tag">${country.capital}</span>
        `;
      } else {
        let clueParts = [];
        if (state.showInitials || isHinted) {
          clueParts.push(`${country.name[0]}…(${country.name.length})`);
        }
        if (state.showCapitals || isHinted) {
          clueParts.push(country.capital);
        }
        const placeholderText = clueParts.length > 0 ? clueParts.join(" · ") : "";
        el.innerHTML = `
          <div class="slot-left">
            ${numSpan}
            <span class="slot-name">${placeholderText}</span>
          </div>
          <span class="slot-hint-tag">${isPinned ? "📍" : ""}</span>
        `;
      }
    }

    function refreshAllSlots() {
      state.activeIsos.forEach((iso) => renderSlot(iso));
      CONTINENT_ORDER.forEach((cont) => {
        const contIsos = MAP_DATA.countries
          .filter((c) => c.continent === cont && state.activeIsos.has(c.iso))
          .map((c) => c.iso);
        if (contIsos.length === 0) return;
        const guessedCount = contIsos.filter((iso) => state.guessedIsos.has(iso)).length;
        const key = cont.replace(/\s+/g, "-");
        const badge = document.getElementById(`contCount-${key}`);
        const bar = document.getElementById(`contBar-${key}`);
        if (badge) badge.textContent = `${guessedCount}/${contIsos.length}`;
        if (bar) bar.style.width = `${((guessedCount / contIsos.length) * 100).toFixed(1)}%`;
      });
    }

    function refreshMapVisuals() {
      MAP_DATA.countries.forEach((c) => {
        const iso = c.iso;
        const inScope = state.activeIsos.has(iso);
        const isGuessed = state.guessedIsos.has(iso);
        const isJustGuessed = state.lastGuessedIso === iso && isGuessed && !state.gameOver;
        const isMissed = state.gameOver && inScope && !isGuessed;
        const isPinned = state.pinnedIso === iso && !isGuessed && !state.gameOver;

        const poly = polyElementsByIso.get(iso);
        if (poly) {
          poly.classList.toggle("out-of-scope", !inScope);
          poly.classList.toggle("guessed", isGuessed);
          poly.classList.toggle("just-guessed", isJustGuessed);
          poly.classList.toggle("missed", isMissed);
          poly.classList.toggle("pinned", isPinned);
        }

        const dot = dotElementsByIso.get(iso);
        if (dot) {
          dot.classList.toggle("out-of-scope", !inScope);
          dot.classList.toggle("guessed", isGuessed);
          dot.classList.toggle("just-guessed", isJustGuessed);
          dot.classList.toggle("missed", isMissed);
          dot.classList.toggle("pinned", isPinned);
        }
      });

      territoryElements.forEach((tEl) => {
        const parentIso = tEl.dataset.parent;
        tEl.classList.toggle("parent-guessed", Boolean(parentIso && state.guessedIsos.has(parentIso)));
      });
    }

    function updateScoreHud() {
      const total = state.activeIsos.size;
      const count = state.guessedIsos.size;
      const pct = total > 0 ? Math.round((count / total) * 100) : 0;
      scoreDisplay.textContent = `${count}/${total}`;
      percentDisplay.textContent = `${pct}%`;
      hudProgressFill.style.width = `${total > 0 ? (count / total) * 100 : 0}%`;
      updateBestScoreBanner();
    }

    function getBestScoreKey() {
      return `terraquiz_best_${state.scope}`;
    }

    function updateBestScoreBanner() {
      try {
        const raw = localStorage.getItem(getBestScoreKey());
        if (!raw) {
          bestScoreDisplay.textContent = "";
          return;
        }
        const data = JSON.parse(raw);
        bestScoreDisplay.textContent = `🏆 ${data.score}/${state.activeIsos.size}`;
      } catch (e) {
        bestScoreDisplay.textContent = "";
      }
    }

    function saveBestScoreIfBetter() {
      try {
        const key = getBestScoreKey();
        const curScore = state.guessedIsos.size;
        const curTime = state.secondsElapsed;
        const prevRaw = localStorage.getItem(key);
        let shouldSave = false;
        if (!prevRaw) {
          shouldSave = curScore > 0;
        } else {
          const prev = JSON.parse(prevRaw);
          if (curScore > prev.score || (curScore === prev.score && curTime < prev.timeSec)) {
            shouldSave = true;
          }
        }
        if (shouldSave) {
          localStorage.setItem(key, JSON.stringify({ score: curScore, timeSec: curTime }));
          updateBestScoreBanner();
        }
      } catch (e) {}
    }

    function formatSeconds(sec) {
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
    }

    function renderTimer() {
      timerDisplay.classList.remove("warning", "danger");
      if (state.timerModeSec === 0) {
        timerModeLabel.textContent = "Stopwatch";
        timerDisplay.textContent = formatSeconds(state.secondsElapsed);
      } else {
        timerModeLabel.textContent = "Time";
        timerDisplay.textContent = formatSeconds(state.secondsLeft);
        if (!state.gameOver && state.secondsLeft <= 30) {
          timerDisplay.classList.add("danger");
        } else if (!state.gameOver && state.secondsLeft <= 120) {
          timerDisplay.classList.add("warning");
        }
      }
    }

    function ensureTimerStarted() {
      if (state.timerRunning || state.gameOver) return;
      state.timerRunning = true;
      clearInterval(state.timerInterval);
      state.timerInterval = setInterval(() => {
        if (state.paused || state.gameOver) return;
        state.secondsElapsed += 1;
        if (state.timerModeSec > 0) {
          state.secondsLeft = Math.max(0, state.secondsLeft - 1);
          renderTimer();
          if (state.secondsLeft === 0) {
            finishGame("timeup");
          }
        } else {
          renderTimer();
        }
      }, 1000);
    }

    function processGuessInput() {
      if (state.gameOver || state.paused) return;
      const rawVal = guessInput.value;
      if (!rawVal.trim()) return;

      ensureTimerStarted();

      const normVal = normalizeStr(rawVal);
      if (!normVal) return;

      const candidates = [];
      if (
        state.lastAutoClearPrefix &&
        Date.now() - state.lastAutoClearTime < 1500
      ) {
        const combined = normalizeStr(state.lastAutoClearPrefix + rawVal);
        if (combined && combined !== normVal) {
          candidates.push({ norm: combined, isContinuation: true });
        }
      }
      candidates.push({ norm: normVal, isContinuation: false });

      for (const cand of candidates) {
        const matchingIsos = aliasToIsoList.get(cand.norm);
        if (!matchingIsos) continue;

        const targetIso = matchingIsos.find(
          (iso) => state.activeIsos.has(iso) && !state.guessedIsos.has(iso)
        );
        if (targetIso) {
          acceptCountryGuess(targetIso, rawVal, cand.isContinuation);
          return;
        }
      }
    }

    function acceptCountryGuess(iso, rawTyped, isContinuation) {
      const country = countriesByIso.get(iso);
      if (!country) return;

      if (!isContinuation) {
        state.lastAutoClearPrefix = rawTyped;
        state.lastAutoClearTime = Date.now();
      } else {
        state.lastAutoClearPrefix = "";
        state.lastAutoClearTime = 0;
      }

      state.guessedIsos.add(iso);
      state.lastGuessedIso = iso;
      if (state.pinnedIso === iso) {
        state.pinnedIso = null;
        updateInputBadge();
      }

      guessInput.value = "";
      guessInput.classList.remove("flash-success");
      void guessInput.offsetWidth;
      guessInput.classList.add("flash-success");

      playTone("correct");
      renderSlot(iso);
      refreshAllSlots();
      refreshMapVisuals();
      updateScoreHud();
      triggerMapPing(iso);

      if (state.autoPan) {
        focusMapOnCountry(iso, false);
      }

      updateStatusStripForGuess(country);

      if (state.guessedIsos.size === state.activeIsos.size) {
        finishGame("victory");
      }
    }

    function updateStatusStripForGuess(country) {
      statusLeft.innerHTML = "";
      const pill = document.createElement("span");
      pill.className = "recent-pill";
      pill.title = "Locate on map";
      pill.innerHTML = `${country.flag} ${country.name} <span style="opacity:0.65;font-weight:500;">· ${country.capital}</span>`;
      pill.addEventListener("click", () => focusMapOnCountry(country.iso, true));
      statusLeft.appendChild(pill);
      clearTimeout(state.statusClearTimeout);
      state.statusClearTimeout = setTimeout(() => {
        if (statusLeft.contains(pill)) statusLeft.innerHTML = "";
      }, 4200);
    }

    function updateInputBadge() {
      if (state.pinnedIso && !state.guessedIsos.has(state.pinnedIso)) {
        inputBadge.textContent = "📍";
        inputBadge.classList.add("pinned");
      } else {
        inputBadge.textContent = "";
        inputBadge.classList.remove("pinned");
      }
    }

    function handleMapCountryClick(iso) {
      if (!state.activeIsos.has(iso)) return;
      const c = countriesByIso.get(iso);
      if (!c) return;

      if (state.guessedIsos.has(iso) || state.gameOver) {
        triggerMapPing(iso);
        updateStatusStripForGuess(c);
        return;
      }

      state.pinnedIso = state.pinnedIso === iso ? null : iso;
      updateInputBadge();
      refreshMapVisuals();
      refreshAllSlots();

      if (state.pinnedIso) {
        triggerMapPing(iso);
        setFloatingStatus(
          `<span class="hint-pill">📍 ${c.continent} · Click 💡 for clue</span>`,
          4000
        );
        guessInput.focus();
      } else {
        statusLeft.innerHTML = "";
      }
    }

    function handleSlotClick(iso) {
      const c = countriesByIso.get(iso);
      if (!c) return;
      if (state.guessedIsos.has(iso) || state.gameOver) {
        focusMapOnCountry(iso, true);
      } else {
        state.pinnedIso = iso;
        updateInputBadge();
        refreshMapVisuals();
        refreshAllSlots();
        focusMapOnCountry(iso, true);
        setFloatingStatus(
          `<span class="hint-pill">📍 ${c.continent} · Click 💡 for clue</span>`,
          4000
        );
        guessInput.focus();
      }
    }

    function triggerHint() {
      if (state.gameOver || state.paused) return;
      ensureTimerStarted();

      let targetIso = state.pinnedIso;
      if (!targetIso || state.guessedIsos.has(targetIso)) {
        const remaining = Array.from(state.activeIsos).filter(
          (iso) => !state.guessedIsos.has(iso)
        );
        if (remaining.length === 0) return;
        targetIso = remaining[Math.floor(Math.random() * remaining.length)];
        state.pinnedIso = targetIso;
      }

      state.hintedIsos.add(targetIso);
      const c = countriesByIso.get(targetIso);
      playTone("hint");
      updateInputBadge();
      refreshMapVisuals();
      renderSlot(targetIso);
      focusMapOnCountry(targetIso, true);

      setFloatingStatus(
        `<span class="hint-pill">💡 🏛️ ${c.capital} · <strong>${c.name[0]}…</strong> (${c.name.length})</span>`,
        6000
      );
      guessInput.focus();
    }

    function togglePause() {
      if (state.gameOver) return;
      if (!state.timerRunning) {
        ensureTimerStarted();
      }
      state.paused = !state.paused;
      pauseOverlay.classList.toggle("visible", state.paused);
      guessInput.disabled = state.paused;
      document.getElementById("pauseBtnIcon").textContent = state.paused ? "▶" : "⏸";
      if (!state.paused) {
        guessInput.focus();
      }
    }

    function finishGame(reason) {
      clearInterval(state.timerInterval);
      state.timerRunning = false;
      state.gameOver = true;
      state.paused = false;
      state.pinnedIso = null;
      pauseOverlay.classList.remove("visible");
      guessInput.disabled = true;
      updateInputBadge();

      const giveUpBtn = document.getElementById("giveUpBtn");
      giveUpBtn.classList.remove("confirming");
      document.getElementById("giveUpBtnIcon").textContent = "🏳️";
      giveUpBtn.disabled = true;
      document.getElementById("pauseBtn").disabled = true;
      document.getElementById("hintBtn").disabled = true;

      saveBestScoreIfBetter();
      refreshMapVisuals();
      refreshAllSlots();

      const total = state.activeIsos.size;
      const count = state.guessedIsos.size;
      const pct = total > 0 ? Math.round((count / total) * 100) : 0;

      summaryScoreBig.textContent = `${count}/${total} (${pct}%)`;
      if (reason === "victory") {
        playTone("complete");
        summaryHeadline.textContent = `🎉 100%!`;
      } else if (reason === "timeup") {
        playTone("complete");
        summaryHeadline.textContent = `⏰ Time's Up!`;
      } else {
        summaryHeadline.textContent = `🏁 Round Complete`;
      }
      summarySubtext.textContent = `⏱️ ${formatSeconds(state.secondsElapsed)}`;
      summaryBanner.classList.add("visible");
    }

    function resetGame() {
      clearInterval(state.timerInterval);
      clearTimeout(state.giveUpConfirmTimeout);
      clearTimeout(state.statusClearTimeout);
      state.scope = document.getElementById("scopeSelect").value;
      state.timerModeSec = parseInt(document.getElementById("timerSelect").value, 10);
      state.secondsLeft = state.timerModeSec;
      state.secondsElapsed = 0;
      state.timerRunning = false;
      state.paused = false;
      state.gameOver = false;
      state.giveUpConfirmPending = false;
      state.guessedIsos.clear();
      state.hintedIsos.clear();
      state.lastGuessedIso = null;
      state.pinnedIso = null;
      state.activeIsos = computeActiveIsos(state.scope);

      pauseOverlay.classList.remove("visible");
      summaryBanner.classList.remove("visible");
      statusLeft.innerHTML = "";

      guessInput.disabled = false;
      guessInput.value = "";
      document.getElementById("pauseBtn").disabled = false;
      document.getElementById("pauseBtnIcon").textContent = "⏸";
      document.getElementById("hintBtn").disabled = false;
      const giveUpBtn = document.getElementById("giveUpBtn");
      giveUpBtn.disabled = false;
      giveUpBtn.classList.remove("confirming");
      document.getElementById("giveUpBtnIcon").textContent = "🏳️";

      updateInputBadge();
      renderTimer();
      buildContinentCards();
      refreshMapVisuals();
      updateScoreHud();

      if (CAMERA_VIEWS[state.scope]) {
        animateCameraTo(state.scope);
      } else {
        animateCameraTo("World");
      }

      guessInput.focus();
    }

    function handleMapHover(e, iso) {
      if (!state.activeIsos.has(iso)) return;
      const c = countriesByIso.get(iso);
      if (!c) return;
      const isGuessed = state.guessedIsos.has(iso);

      if (isGuessed || state.gameOver) {
        mapTooltip.innerHTML = `
          <div class="tooltip-title"><span>${c.flag}</span><span>${c.name}</span></div>
          <div class="tooltip-meta">🏛️ ${c.capital}</div>
        `;
      } else {
        const isHinted = state.hintedIsos.has(iso);
        const clue = isHinted ? `🏛️ ${c.capital} · ${c.name[0]}…` : c.continent;
        mapTooltip.innerHTML = `
          <div class="tooltip-title"><span>❓</span><span>${clue}</span></div>
        `;
      }

      mapTooltip.classList.add("visible");
      const x = Math.min(window.innerWidth - 220, e.clientX + 14);
      const y = Math.min(window.innerHeight - 65, e.clientY + 14);
      mapTooltip.style.left = `${x}px`;
      mapTooltip.style.top = `${y}px`;
    }

    function hideMapTooltip() {
      mapTooltip.classList.remove("visible");
    }

    function applyViewBox(vb) {
      state.viewBox = vb;
      worldSvg.setAttribute("viewBox", vb.map((n) => n.toFixed(1)).join(" "));
      const zoomRatio = vb[2] / MAP_DATA.svgWidth;
      const scaleFactor = Math.max(0.42, Math.min(1.0, Math.pow(zoomRatio, 0.55)));
      dotElementsByIso.forEach((circle) => {
        const baseR = parseFloat(circle.dataset.baseR || "4.0");
        circle.setAttribute("r", (baseR * scaleFactor).toFixed(2));
      });
    }

    function animateViewBoxTo(targetVb, durationMs = 360) {
      cancelAnimationFrame(state.animFrame);
      const startVb = [...state.viewBox];
      const startTime = performance.now();

      function step(now) {
        const t = Math.min(1, (now - startTime) / durationMs);
        const ease = 1 - Math.pow(1 - t, 3);
        const cur = startVb.map((s, i) => s + (targetVb[i] - s) * ease);
        applyViewBox(cur);
        if (t < 1) {
          state.animFrame = requestAnimationFrame(step);
        }
      }
      state.animFrame = requestAnimationFrame(step);
    }

    function animateCameraTo(camName) {
      const target = CAMERA_VIEWS[camName] || CAMERA_VIEWS["World"];
      state.currentCamera = camName;
      document.querySelectorAll(".camera-tab").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.cam === camName);
      });
      animateViewBoxTo(target);
    }

    function focusMapOnCountry(iso, withPing = true) {
      const c = countriesByIso.get(iso);
      if (!c) return;
      if (withPing) triggerMapPing(iso);

      const [bx, by, bw, bh] = c.bbox;
      const padW = Math.max(280, bw * 2.4);
      const padH = padW * (MAP_DATA.svgHeight / MAP_DATA.svgWidth);
      const cx = bx + bw / 2;
      const cy = by + bh / 2;
      const tx = Math.max(0, Math.min(MAP_DATA.svgWidth - padW, cx - padW / 2));
      const ty = Math.max(0, Math.min(MAP_DATA.svgHeight - padH, cy - padH / 2));
      animateViewBoxTo([tx, ty, padW, padH]);
    }

    function zoomByFactor(factor, centerClientX, centerClientY) {
      const [vx, vy, vw, vh] = state.viewBox;
      const newW = Math.max(180, Math.min(MAP_DATA.svgWidth, vw * factor));
      const newH = newW * (MAP_DATA.svgHeight / MAP_DATA.svgWidth);

      let rx = 0.5;
      let ry = 0.5;
      if (typeof centerClientX === "number" && typeof centerClientY === "number") {
        const rect = worldSvg.getBoundingClientRect();
        if (rect.width > 0 && rect.height > 0) {
          rx = Math.max(0, Math.min(1, (centerClientX - rect.left) / rect.width));
          ry = Math.max(0, Math.min(1, (centerClientY - rect.top) / rect.height));
        }
      }

      const newX = Math.max(0, Math.min(MAP_DATA.svgWidth - newW, vx + (vw - newW) * rx));
      const newY = Math.max(0, Math.min(MAP_DATA.svgHeight - newH, vy + (vh - newH) * ry));
      applyViewBox([newX, newY, newW, newH]);
    }

    function setupMapInteractions() {
      let isDragging = false;
      let dragStartClient = [0, 0];
      let dragStartVb = [0, 0, 0, 0];

      worldSvg.addEventListener("pointerdown", (e) => {
        if (e.button !== 0) return;
        isDragging = true;
        dragStartClient = [e.clientX, e.clientY];
        dragStartVb = [...state.viewBox];
        worldSvg.classList.add("dragging");
      });

      window.addEventListener("pointermove", (e) => {
        if (!isDragging) return;
        const rect = worldSvg.getBoundingClientRect();
        if (rect.width === 0 || rect.height === 0) return;
        const dx = ((e.clientX - dragStartClient[0]) / rect.width) * dragStartVb[2];
        const dy = ((e.clientY - dragStartClient[1]) / rect.height) * dragStartVb[3];
        const nx = Math.max(0, Math.min(MAP_DATA.svgWidth - dragStartVb[2], dragStartVb[0] - dx));
        const ny = Math.max(0, Math.min(MAP_DATA.svgHeight - dragStartVb[3], dragStartVb[1] - dy));
        applyViewBox([nx, ny, dragStartVb[2], dragStartVb[3]]);
      });

      window.addEventListener("pointerup", () => {
        if (isDragging) {
          isDragging = false;
          worldSvg.classList.remove("dragging");
        }
      });

      worldSvg.addEventListener(
        "wheel",
        (e) => {
          e.preventDefault();
          const factor = e.deltaY < 0 ? 0.82 : 1.22;
          zoomByFactor(factor, e.clientX, e.clientY);
        },
        { passive: false }
      );
    }

    function copyScorecard() {
      const total = state.activeIsos.size;
      const count = state.guessedIsos.size;
      const pct = total > 0 ? Math.round((count / total) * 100) : 0;
      const scopeName = document.getElementById("scopeSelect").selectedOptions[0].text;
      const lines = [
        `🌍 TerraQuiz — ${scopeName}`,
        `🏆 ${count}/${total} (${pct}%) · ⏱️ ${formatSeconds(state.secondsElapsed)}`
      ];
      CONTINENT_ORDER.forEach((cont) => {
        const contIsos = MAP_DATA.countries
          .filter((c) => c.continent === cont && state.activeIsos.has(c.iso))
          .map((c) => c.iso);
        if (contIsos.length > 0) {
          const g = contIsos.filter((iso) => state.guessedIsos.has(iso)).length;
          lines.push(`${CONTINENT_ICONS[cont]} ${g}/${contIsos.length}`);
        }
      });
      const text = lines.join("\n");

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(
          () => showToast("📋 Copied!"),
          () => fallbackCopy(text)
        );
      } else {
        fallbackCopy(text);
      }
    }

    function fallbackCopy(text) {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand("copy");
        showToast("📋 Copied!");
      } catch (e) {}
      document.body.removeChild(ta);
    }

    function wireControls() {
      guessInput.addEventListener("input", processGuessInput);
      guessInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          processGuessInput();
        }
      });

      document.getElementById("globeHomeBtn").addEventListener("click", () => animateCameraTo("World"));
      document.getElementById("scopeSelect").addEventListener("change", resetGame);
      document.getElementById("timerSelect").addEventListener("change", resetGame);

      document.getElementById("toggleDotsBtn").addEventListener("click", (e) => {
        state.showDots = !state.showDots;
        e.currentTarget.classList.toggle("active", state.showDots);
        mapCard.classList.toggle("hide-dots", !state.showDots);
      });

      document.getElementById("toggleFocusBtn").addEventListener("click", (e) => {
        state.autoPan = !state.autoPan;
        e.currentTarget.classList.toggle("active", state.autoPan);
        showToast(state.autoPan ? "⌖ Auto-Pan ON" : "⌖ Auto-Pan OFF");
      });

      document.getElementById("toggleSoundBtn").addEventListener("click", (e) => {
        state.soundEnabled = !state.soundEnabled;
        e.currentTarget.classList.toggle("active", state.soundEnabled);
        document.getElementById("soundBtnLabel").textContent = state.soundEnabled ? "🔊" : "🔇";
      });

      document.getElementById("toggleThemeBtn").addEventListener("click", () => {
        const html = document.documentElement;
        const next = html.getAttribute("data-theme") === "dark" ? "light" : "dark";
        html.setAttribute("data-theme", next);
        document.getElementById("themeBtnLabel").textContent = next === "dark" ? "☀️" : "🌙";
        try {
          localStorage.setItem("terraquiz_theme", next);
        } catch (e) {}
      });

      document.getElementById("hintBtn").addEventListener("click", triggerHint);
      document.getElementById("pauseBtn").addEventListener("click", togglePause);
      document.getElementById("resumeOverlayBtn").addEventListener("click", togglePause);

      const giveUpBtn = document.getElementById("giveUpBtn");
      giveUpBtn.addEventListener("click", () => {
        if (state.gameOver) return;
        if (!state.giveUpConfirmPending) {
          state.giveUpConfirmPending = true;
          giveUpBtn.classList.add("confirming");
          document.getElementById("giveUpBtnIcon").textContent = "🏳️ Sure?";
          clearTimeout(state.giveUpConfirmTimeout);
          state.giveUpConfirmTimeout = setTimeout(() => {
            state.giveUpConfirmPending = false;
            if (!state.gameOver) {
              giveUpBtn.classList.remove("confirming");
              document.getElementById("giveUpBtnIcon").textContent = "🏳️";
            }
          }, 3000);
        } else {
          finishGame("giveup");
        }
      });

      document.getElementById("restartBtn").addEventListener("click", resetGame);
      document.getElementById("playAgainBtn").addEventListener("click", resetGame);
      document.getElementById("copyScoreBtn").addEventListener("click", copyScorecard);

      document.querySelectorAll(".camera-tab").forEach((btn) => {
        btn.addEventListener("click", () => animateCameraTo(btn.dataset.cam));
      });

      document.getElementById("zoomInBtn").addEventListener("click", () => zoomByFactor(0.75));
      document.getElementById("zoomOutBtn").addEventListener("click", () => zoomByFactor(1.35));
      document.getElementById("zoomResetBtn").addEventListener("click", () => animateCameraTo("World"));

      document.querySelectorAll("#listFilterGroup .filter-pill").forEach((btn) => {
        btn.addEventListener("click", () => {
          state.listFilter = btn.dataset.filter;
          document.querySelectorAll("#listFilterGroup .filter-pill").forEach((b) => {
            b.classList.toggle("active", b === btn);
          });
          refreshAllSlots();
        });
      });

      document.getElementById("toggleCapitalsBtn").addEventListener("click", (e) => {
        state.showCapitals = !state.showCapitals;
        e.currentTarget.classList.toggle("active", state.showCapitals);
        refreshAllSlots();
      });

      document.getElementById("toggleInitialsBtn").addEventListener("click", (e) => {
        state.showInitials = !state.showInitials;
        e.currentTarget.classList.toggle("active", state.showInitials);
        refreshAllSlots();
      });
    }

    window.addEventListener("DOMContentLoaded", () => {
      try {
        const savedTheme = localStorage.getItem("terraquiz_theme");
        if (savedTheme === "dark" || savedTheme === "light") {
          document.documentElement.setAttribute("data-theme", savedTheme);
          document.getElementById("themeBtnLabel").textContent = savedTheme === "dark" ? "☀️" : "🌙";
        }
      } catch (e) {}

      initSvgMap();
      setupMapInteractions();
      wireControls();
      resetGame();
    });
  </script>
</body>
</html>
